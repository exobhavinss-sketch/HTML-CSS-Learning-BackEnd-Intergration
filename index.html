tips:['Using px for everything. On phones, % and rem fit better.']},

/* ---------- FLEXBOX ---------- */
{id:'flex-on',g:'flex',t:'Turn on flexbox',goal:'put boxes side by side with flexbox',tags:['display: flex'],kw:'flexbox flex container items row',
why:`<p>Flexbox has two parts. The <b>parent</b> is the <i>flex container</i>. The children inside it are <i>flex items</i>.</p><p>Write <code>display: flex</code> on the <b>parent only</b>. Its children then line up in a row.</p>`,
html:FLEXHTML,base:FLEXBASE,
css:[['.container','display: flex','Pick a value',{opts:{'flex':'Boxes sit side by side in a row','block':'Normal: each box takes a full line','inline-flex':'Like flex, but the container shrinks to fit the boxes'}}]],
tips:['Writing <code>display: flex</code> on the boxes. It goes on the parent.','Expecting grandchildren to line up. Only direct children become flex items.']},

{id:'flex-direction',g:'flex',t:'flex-direction',goal:'choose row or column in flexbox',tags:['flex-direction'],kw:'direction row column reverse main axis',
why:`<p><code>flex-direction</code> sets the main direction. <code>row</code> = left to right. <code>column</code> = top to bottom.</p><p><code>justify-content</code> always works along this main direction.</p>`,
html:FLEXHTML,base:FLEXBASE,
css:[['.container','display: flex','Flexbox turns on'],['.container','flex-direction: row','Pick a direction',{opts:DIRECTION}]],
tips:['Forgetting that with <code>column</code>, <code>justify-content</code> now moves boxes up-down.']},

{id:'justify',g:'flex',t:'justify-content',goal:'move flex items left, right or center',tags:['justify-content'],kw:'justify content space between around evenly center horizontal',
why:`<p><code>justify-content</code> moves the items along the main direction. In a row, that is left-right.</p><p>Try each value from the dropdown.</p>`,
html:FLEXHTML,base:FLEXBASE,
css:[['.container','display: flex','Flexbox turns on'],['.container','justify-content: flex-start','Pick a value',{opts:JUSTIFY}]],
tips:['Writing <code>justify-content: left</code>. Use <code>flex-start</code>.','Using it without <code>display: flex</code>. Nothing happens.']},

{id:'align',g:'flex',t:'align-items',goal:'move flex items up, down or to the middle',tags:['align-items'],kw:'align items vertical center top bottom stretch baseline cross axis',
why:`<p><code>align-items</code> moves items in the other direction. In a row, that is up-down.</p><p>The container needs some height, or there is no room to move.</p>`,
html:`<div class="container">
  <div class="box">1</div>
  <div class="box big">2</div>
  <div class="box">3</div>
</div>`,base:FLEXBASE+`
.big { font-size: 30px; }`,
css:[['.container','height: 180px','Container becomes tall'],['.container','display: flex','Flexbox turns on'],['.container','align-items: stretch','Pick a value',{opts:ALIGN}]],
tips:['No height on the container. The boxes have nowhere to move.']},

{id:'gap',g:'flex',t:'gap',goal:'add space between flex items',tags:['gap'],kw:'gap space between row-gap column-gap',
why:`<p><code>gap</code> puts space between items only, not at the outer edges. It works in flexbox and grid.</p><p><code>row-gap</code> and <code>column-gap</code> set the two directions separately.</p>`,
html:FLEXHTML,base:FLEXBASE,
css:[['.container','display: flex','Flexbox turns on'],['.container','gap: 20px','Pick a value',{opts:{'0':'No space','10px':'Small space','20px':'Medium space','50px':'Big space'}}]],
tips:['Using margin on every box. <code>gap</code> is simpler and does not add space at the edges.']},

{id:'wrap',g:'flex',t:'flex-wrap',goal:'let flex items move to the next line',tags:['flex-wrap'],kw:'wrap next line overflow many items',
why:`<p>By default flexbox squeezes all items into one line. <code>flex-wrap: wrap</code> lets extra items go to the next line.</p>`,
html:`<div class="container">
  <div class="box">1</div><div class="box">2</div>
  <div class="box">3</div><div class="box">4</div>
  <div class="box">5</div><div class="box">6</div>
  <div class="box">7</div><div class="box">8</div>
</div>`,base:FLEXBASE+`
.box { width: 120px; }`,
css:[['.container','display: flex','Flexbox turns on (boxes get squeezed)'],['.container','gap: 8px','Space between boxes'],['.container','flex-wrap: wrap','Pick a value',{opts:{'nowrap':'All boxes forced into one line (they shrink)','wrap':'Extra boxes move to the next line','wrap-reverse':'Extra boxes move to a line above'}}]],
tips:['Product grids without <code>flex-wrap</code>. On phones the cards become very thin.']},

{id:'grow',g:'flex',t:'flex-grow & flex: 1',goal:'make a flex item fill the empty space',tags:['flex-grow','flex'],kw:'grow fill space flex 1 equal width shrink basis',
why:`<p><code>flex-grow</code> goes on a <b>child</b>. It says how much of the empty space that child takes. <code>0</code> = none.</p><p><code>flex: 1</code> on all children gives them equal widths.</p>`,
html:FLEXHTML,base:FLEXBASE,
css:[['.container','display: flex','Flexbox turns on'],['.container','gap: 8px','Space between boxes'],['.box:nth-child(2)','flex-grow: 1','Pick a value',{opts:{'0':'Box 2 stays its normal size','1':'Box 2 takes all the empty space','3':'Box 2 takes 3 shares of the space'}}],['.box','flex: 1','All boxes get equal shares (box 2 keeps its own number)']],
tips:['Putting <code>flex-grow</code> on the parent. It goes on the child.']},

{id:'alignself',g:'flex',t:'align-self',goal:'move only one flex item up or down',tags:['align-self'],kw:'align self one item different',
why:`<p><code>align-self</code> goes on one child. It overrides <code>align-items</code> for that child only.</p>`,
html:FLEXHTML,base:FLEXBASE,
css:[['.container','height: 180px','Container becomes tall'],['.container','display: flex','Flexbox turns on'],['.container','align-items: flex-start','All boxes go to the top'],['.box:nth-child(2)','align-self: flex-end','Pick a value',{opts:{'flex-end':'Only box 2 goes to the bottom','center':'Only box 2 goes to the middle','stretch':'Only box 2 stretches to full height','auto':'Box 2 follows align-items like the others'}}]],
tips:['Using <code>align-self</code> on the parent. It goes on the child.']},

{id:'order',g:'flex',t:'order',goal:'change the order of flex items without changing HTML',tags:['order'],kw:'order rearrange sequence',
why:`<p><code>order</code> changes where a child shows. Default is <code>0</code>. Smaller numbers come first. The HTML stays the same.</p>`,
html:FLEXHTML4,base:FLEXBASE,
css:[['.container','display: flex','Flexbox turns on'],['.container','gap: 8px','Space between boxes'],['.box:nth-child(1)','order: 5','Pick a value',{opts:{'5':'Box 1 moves to the end','0':'Box 1 stays in its place'}}],['.box:nth-child(3)','order: -1','Box 3 jumps to the front']],
tips:['Using <code>order</code> for important content. Screen readers still read in HTML order.']},

{id:'flex-play',g:'flex',t:'Flexbox playground',goal:'try all flexbox properties together',tags:['flex-direction','justify-content','align-items','flex-wrap','gap'],kw:'flexbox playground practice all properties',
why:`<p>All the container properties in one place. Turn on each line and change the dropdowns to see how they work together.</p><p>Tip: set <code>flex-direction: column</code>, then see how <code>justify-content</code> and <code>align-items</code> swap jobs.</p>`,
html:`<div class="container">
  <div class="box">1</div>
  <div class="box big">2</div>
  <div class="box">3</div>
  <div class="box">4</div>
</div>`,base:FLEXBASE+`
.big { font-size: 30px; }
.container { height: 240px; }`,
css:[['.container','display: flex','Flexbox turns on'],['.container','flex-direction: row','Main direction',{opts:DIRECTION}],['.container','justify-content: center','Along the main direction',{opts:JUSTIFY}],['.container','align-items: center','Across the main direction',{opts:ALIGN}],['.container','flex-wrap: wrap','Wrapping',{opts:{'nowrap':'One line only','wrap':'Can go to the next line'}}],['.container','gap: 10px','Space',{opts:{'0':'No space','10px':'Small space','30px':'Big space'}}]],
tips:['Mixing up the two: <code>justify-content</code> = main direction, <code>align-items</code> = the other direction.']},

/* ---------- GRID ---------- */
{id:'grid-cols',g:'grid',t:'Grid columns',goal:'make columns with CSS grid',tags:['display: grid','grid-template-columns'],kw:'grid columns fr repeat minmax auto-fit',
why:`<p><code>display: grid</code> on the parent turns on grid. <code>grid-template-columns</code> sets the columns.</p><p><code>fr</code> = one share of the free space. <code>1fr 2fr</code> means the second column is twice as wide.</p>`,
html:`<div class="container">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
  <div class="box">4</div><div class="box">5</div><div class="box">6</div>
</div>`,base:FLEXBASE+`
.box { text-align: center; }`,
css:[['.container','display: grid','Grid turns on (still 1 column)'],['.container','grid-template-columns: repeat(3, 1fr)','Pick the columns',{opts:{'repeat(3, 1fr)':'3 equal columns','1fr 1fr':'2 equal columns','200px 1fr':'First column 200px, second takes the rest','1fr 2fr 1fr':'Middle column twice as wide','repeat(auto-fit, minmax(100px, 1fr))':'As many columns as fit (try Phone)'}}],['.container','gap: 10px','Pick the space',{opts:{'0':'No space','10px':'Small space','30px':'Big space'}}]],
tips:['<code>repeat(3 1fr)</code> without the comma.','Using flexbox for a 2D layout (rows AND columns). Grid is easier for that.']},

{id:'grid-span',g:'grid',t:'Span rows & columns',goal:'make one grid item bigger than the others',tags:['grid-column','grid-row'],kw:'span merge cell bigger grid column row',
why:`<p><code>grid-column: span 2</code> makes a child cover 2 columns. <code>grid-row: span 2</code> makes it cover 2 rows.</p>`,
html:`<div class="container">
  <div class="box">1</div><div class="box">2</div><div class="box">3</div>
  <div class="box">4</div><div class="box">5</div><div class="box">6</div>
</div>`,base:FLEXBASE+`
.box { text-align: center; }`,
css:[['.container','display: grid','Grid turns on'],['.container','grid-template-columns: repeat(3, 1fr)','3 equal columns'],['.container','gap: 10px','Space between cells'],['.box:nth-child(1)','grid-column: span 2','Pick a value',{opts:{'span 2':'Box 1 covers 2 columns','span 3':'Box 1 covers the full row'}}],['.box:nth-child(2)','grid-row: span 2','Box 2 covers 2 rows']],
tips:['Spanning more columns than exist. The grid adds extra columns.']},

{id:'grid-areas',g:'grid',t:'Page layout with grid areas',goal:'build a page layout with grid areas',tags:['grid-template-areas','grid-area'],kw:'grid areas layout header sidebar footer template',
why:`<p>Give each part a name with <code>grid-area</code>. Then draw the layout with those names in <code>grid-template-areas</code>. Each quoted line is one row.</p>`,
html:`<div class="page">
  <header>Header</header>
  <aside>Sidebar</aside>
  <main>Main content</main>
  <footer>Footer</footer>
</div>`,base:`header, aside, main, footer {
  padding: 16px;
  color: white;
  font-weight: bold;
  border-radius: 6px;
}
header { background: #1d4ed8; }
aside { background: #16a34a; }
main { background: #f59e0b; min-height: 100px; }
footer { background: #db2777; }`,
css:[['.page','display: grid','Grid turns on'],['.page','grid-template-columns: 140px 1fr','Sidebar column 140px, main takes the rest'],['.page','gap: 8px','Space between parts'],['.page','grid-template-areas: "header header" "side main" "footer footer"','Draws the layout: header and footer across the full width'],['header','grid-area: header','Header goes to the "header" area'],['aside','grid-area: side','Sidebar goes to the "side" area'],['main','grid-area: main','Main goes to the "main" area'],['footer','grid-area: footer','Footer goes to the "footer" area']],
tips:['Each row in <code>grid-template-areas</code> must have the same number of names.','Putting quotes around names in <code>grid-area</code>. Write <code>grid-area: header</code>, no quotes.']},

/* ---------- DISPLAY, SIZE, POSITION ---------- */
{id:'display',g:'position',t:'display: block, inline, none',goal:'understand block, inline and inline-block',tags:['display'],kw:'display block inline inline-block none hide',
why:`<p><b>block</b> (div, p, h1) takes a full line. <b>inline</b> (span, a) stays in the line and ignores width/height. <b>inline-block</b> stays in the line but accepts width/height. <b>none</b> hides it completely.</p>`,
html:`<div class="a">div (block)</div>
<span class="b">span one</span>
<span class="b">span two</span>
<div class="a">div (block)</div>`,base:`.a { background: #dbeafe; padding: 6px; }
.b { background: #fef3c7; padding: 6px; border: 1px solid #f59e0b; }`,
css:[['.b','width: 150px','Width 150px (look: works only for block / inline-block)'],['.b','height: 50px','Height 50px (same rule)'],['.b','display: inline','Pick a value',{opts:{'inline':'Stays in the line, width/height ignored (default for span)','inline-block':'Stays in the line AND takes width/height','block':'Each span takes a full line','none':'Spans disappear completely'}}]],
tips:['Giving <code>width</code> to a <code>span</code> or <code>a</code> and wondering why nothing changes.']},

{id:'hide',g:'position',t:'Hide an element',goal:'hide something on the page',tags:['display: none','visibility','opacity'],kw:'hide invisible opacity visibility transparent',
why:`<p>Three ways, with a difference. <code>display: none</code> removes it and closes the gap. <code>visibility: hidden</code> hides it but keeps its space. <code>opacity</code> makes it see-through.</p><p>Turn on one line at a time.</p>`,
html:`<div class="box">1</div>
<div class="box hide">2 (the one to hide)</div>
<div class="box">3</div>`,base:BOXES+`
.box { margin-bottom: 6px; }`,
css:[['.hide','opacity: 0.3','Box 2 becomes see-through'],['.hide','visibility: hidden','Box 2 is invisible, but its space stays'],['.hide','display: none','Box 2 is gone and box 3 moves up']],
tips:['Hiding content with CSS that screen readers should still read.']},

{id:'size',g:'position',t:'Width, height, min & max',goal:'control the size of a box',tags:['width','height','max-width','min-height'],kw:'width height max min size responsive',
why:`<p><code>width</code> / <code>height</code> set a size. <code>max-width</code> sets a limit, so the box can shrink on phones but not grow too wide on laptops. <code>min-height</code> gives a minimum height that can still grow.</p><p>Try Laptop and Phone.</p>`,
html:`<div class="box">I am a box. Add more text here and see what happens to my height.</div>`,base:`.box { background: #dbeafe; border: 2px solid #1d4ed8; padding: 10px; }`,
css:[['.box','width: 90%','90% of the parent width'],['.box','max-width: 300px','But never wider than 300px'],['.box','min-height: 100px','At least 100px tall, grows with more text'],['.box','margin: 0 auto','Box moves to the center']],
tips:['Fixed <code>height</code> with changing text. The text spills out. Use <code>min-height</code>.']},

{id:'boxsizing',g:'position',t:'box-sizing',goal:'stop padding from making my box wider',tags:['box-sizing'],kw:'box sizing border-box content-box width padding',
why:`<p>Normally <code>width</code> is only the content. Padding and border are added on top, so the box gets wider than you asked.</p><p><code>box-sizing: border-box</code> keeps the total width fixed. Most websites set it on everything: <code>* { box-sizing: border-box; }</code></p>`,
html:`<div class="box">width: 200px</div>
<div class="ruler">This bar is exactly 200px</div>`,base:`.ruler { width: 200px; background: #16a34a; color: white; font-size: 12px; margin-top: 6px; }`,
css:[['.box','width: 200px','Box is 200px, same as the green bar'],['.box','background: #dbeafe','Background shows the box'],['.box','padding: 20px','Box grows wider than the green bar!'],['.box','border: 5px solid #1d4ed8','Grows even more'],['.box','box-sizing: border-box','Pick a value',{opts:{'border-box':'Total width stays 200px (padding fits inside)','content-box':'Width = content only; padding and border added (250px total)'}}]],
tips:['Forgetting <code>box-sizing</code>, then boxes overflow their columns by a few pixels.']},

{id:'overflow',g:'position',t:'Overflow (too much content)',goal:'handle text that does not fit in a box',tags:['overflow'],kw:'overflow scroll hidden auto spill',
why:`<p>When content is bigger than its box, <code>overflow</code> decides what to do: show it outside, cut it, or add a scrollbar.</p>`,
html:`<div class="box">CampusKart delivers books, pens, notebooks, bags, lab coats and calculators to every hostel on campus. Orders placed before 6 PM arrive the same day. Returns are free within 7 days.</div>`,base:`.box { width: 220px; height: 80px; border: 2px solid #1d4ed8; padding: 8px; margin-bottom: 60px; }`,
css:[['.box','overflow: visible','Pick a value',{opts:{'visible':'Extra text spills outside the box (default)','hidden':'Extra text is cut off','scroll':'Scrollbar is always there','auto':'Scrollbar only when needed'}}]],
tips:['Using <code>overflow: hidden</code> and cutting off important text.']},

{id:'position',g:'position',t:'position: relative, absolute, fixed',goal:'understand the position property',tags:['position','top','left'],kw:'position static relative absolute fixed top left right bottom',
why:`<p><b>static</b> = normal (top/left do nothing). <b>relative</b> = move from its own place, the old space stays. <b>absolute</b> = leaves the flow, placed from the nearest parent with position. <b>fixed</b> = placed from the screen, stays when you scroll.</p>`,
html:`<div class="parent">
  <div class="box">1</div>
  <div class="box">2 (I move)</div>
  <div class="box">3</div>
</div>`,base:BOXES+`
.parent { border: 2px dashed #94a3b8; padding: 8px; }
.box { margin-bottom: 6px; width: 160px; }`,
css:[['.parent','position: relative','Parent becomes the reference for absolute'],['.box:nth-child(2)','top: 20px','20px from the top'],['.box:nth-child(2)','left: 60px','60px from the left'],['.box:nth-child(2)','position: static','Pick a value',{opts:{'static':'Normal place, top/left ignored','relative':'Moves from its own place; its old space stays empty','absolute':'Leaves the flow; box 3 moves up; placed from the parent corner','fixed':'Placed from the screen corner'}}]],
tips:['Using <code>absolute</code> without a <code>relative</code> parent. It jumps to the page corner.']},

{id:'zindex',g:'position',t:'z-index (what is in front)',goal:'bring one box in front of another',tags:['z-index'],kw:'z-index layer front back overlap stack',
why:`<p>When boxes overlap, <b>higher</b> <code>z-index</code> comes to the front. It works only on elements with a <code>position</code> (relative, absolute, fixed, sticky).</p>`,
html:`<div class="stage">
  <div class="box a">A</div>
  <div class="box b">B</div>
  <div class="box c">C</div>
</div>`,base:`.stage { position: relative; height: 170px; }
.box { position: absolute; width: 120px; height: 80px; color: white; font-weight: bold; padding: 8px; border-radius: 6px; }
.a { top: 10px; left: 10px; background: #1d4ed8; }
.b { top: 40px; left: 60px; background: #16a34a; }
.c { top: 70px; left: 110px; background: #db2777; }`,
css:[['.a','z-index: 3','Pick a value',{opts:{'3':'A comes to the front','1':'A stays at the back'}}],['.b','z-index: 2','B sits above C']],
tips:['z-index on an element without <code>position</code>. Nothing happens.']},

{id:'fixedbtn',g:'position',t:'Button fixed in the corner',goal:'keep a button in the corner while scrolling',tags:['position: fixed'],kw:'fixed floating button corner chat help whatsapp',
why:`<p><code>position: fixed</code> places it from the screen, not the page. Scroll inside the preview: the button stays.</p>`,
html:`<h2>Products</h2>
<p>Pens</p><p>Notebooks</p><p>Bags</p><p>Lab coats</p>
<p>Calculators</p><p>Files</p><p>Markers</p><p>Rulers</p>
<p>Erasers</p><p>Staplers</p><p>Glue</p><p>Scissors</p>
<a href="help.html" class="help">Help</a>`,
css:[['.help','position: fixed','Button leaves the page flow'],['.help','bottom: 20px','20px from the bottom of the screen'],['.help','right: 20px','20px from the right'],['.help','background: #16a34a','Green button'],['.help','color: white','White text'],['.help','padding: 12px 20px','Bigger button'],['.help','border-radius: 30px','Pill shape'],['.help','text-decoration: none','No underline']],
tips:['Fixed elements covering content at the bottom of the page. Add padding to body.']},

/* ---------- EFFECTS ---------- */
{id:'transform',g:'effects',t:'transform',goal:'rotate, scale or move an element',tags:['transform'],kw:'transform rotate scale translate skew',
why:`<p><code>transform</code> changes how an element looks without moving other elements. <code>rotate</code> turns it, <code>scale</code> resizes it, <code>translate</code> moves it, <code>skew</code> leans it.</p>`,
html:`<div class="box">CampusKart</div>`,base:BOXES+`
.box { width: 150px; margin: 40px; text-align: center; }`,
css:[['.box','transform: rotate(15deg)','Pick a value',{opts:{'rotate(15deg)':'Turns 15 degrees','scale(1.4)':'Becomes 1.4 times bigger','translateX(60px)':'Moves 60px to the right','skew(15deg)':'Leans sideways','rotate(45deg) scale(1.2)':'Two at once: turns and grows'}}]],
tips:['Writing two <code>transform</code> lines. The second replaces the first. Put both in one line.']},

{id:'transition',g:'effects',t:'transition',goal:'make a change happen smoothly',tags:['transition'],kw:'transition smooth duration ease hover animate',
why:`<p><code>transition</code> makes a change (like on hover) happen slowly instead of at once. Move your mouse over the box, then change the time.</p>`,
html:`<div class="box">Hover me</div>`,base:BOXES,
css:[['.box','width: 120px','Box is 120px wide'],['.box:hover','width: 260px','On hover: box grows to 260px'],['.box:hover','background: #db2777','On hover: box turns pink'],['.box','transition: 0.5s','Pick a value',{opts:{'0.5s':'Half a second, smooth','2s':'Two seconds, slow','0s':'Instant, no animation','width 1s ease-in':'Only the width animates, colour changes instantly'}}]],
tips:['Putting <code>transition</code> only on <code>:hover</code>. Then it is smooth only one way.']},

{id:'animation',g:'effects',t:'Animation (@keyframes)',goal:'make something move on its own',tags:['@keyframes','animation'],kw:'animation keyframes move bounce loop infinite',
why:`<p><code>@keyframes</code> describes the movement: where it starts (<code>from</code>) and where it ends (<code>to</code>). <code>animation</code> properties on the element play it.</p>`,
html:`<div class="ball"></div>`,base:`.ball { width: 50px; height: 50px; border-radius: 50%; background: #1d4ed8; margin: 20px; }`,
css:[['@keyframes move|from','transform: translateX(0)','Start position'],['@keyframes move|to','transform: translateX(200px)','End position: 200px to the right'],['.ball','animation-name: move','Ball plays the "move" animation'],['.ball','animation-duration: 2s','Pick a value',{opts:{'2s':'Takes 2 seconds','0.5s':'Very fast','5s':'Very slow'}}],['.ball','animation-iteration-count: infinite','Pick a value',{opts:{'infinite':'Repeats forever','1':'Plays once','3':'Plays 3 times'}}],['.ball','animation-direction: alternate','Pick a value',{opts:{'alternate':'Goes and comes back','normal':'Jumps back to the start each time'}}]],
tips:['Name in <code>animation-name</code> does not match the <code>@keyframes</code> name.','Forgetting <code>animation-duration</code>. The default is 0s, so nothing moves.']},

{id:'gradient',g:'effects',t:'Gradient background',goal:'add a gradient background',tags:['linear-gradient','radial-gradient'],kw:'gradient colour blend background',
why:`<p>A gradient blends two or more colours. <code>linear-gradient</code> goes in a line. <code>radial-gradient</code> spreads out from the center. It is written in <code>background</code>.</p>`,
html:`<div class="banner"><h1>Diwali Sale</h1></div>`,
css:[['.banner','height: 140px','Banner becomes tall'],['.banner','padding: 16px','Space inside'],['.banner','color: white','White text'],['.banner','border-radius: 12px','Round corners'],['.banner','background: linear-gradient(to right, #1d4ed8, #16a34a)','Pick a value',{opts:{'linear-gradient(to right, #1d4ed8, #16a34a)':'Blue to green, left to right','linear-gradient(135deg, #f59e0b, #db2777)':'Orange to pink, diagonal','linear-gradient(to bottom, #1e3a8a, #93c5fd)':'Dark to light blue, top to bottom','radial-gradient(circle, #fcd34d, #f59e0b)':'Yellow center spreading out'}}]],
tips:['Writing it in <code>background-color</code>. A gradient is an image, so use <code>background</code>.']},

{id:'cursor',g:'effects',t:'Mouse cursor',goal:'change the mouse pointer',tags:['cursor'],kw:'cursor pointer hand mouse',
why:`<p><code>cursor</code> changes the mouse pointer when it is over the element. Move your mouse over the box after each change.</p>`,
html:`<div class="box">Hover over me</div>`,base:BOXES+`
.box { width: 200px; text-align: center; }`,
css:[['.box','cursor: pointer','Pick a value',{opts:{'pointer':'Hand, means “you can click”','not-allowed':'Blocked sign','help':'Question mark','move':'Move arrows','grab':'Open hand','wait':'Loading'}}]],
tips:['Forgetting <code>cursor: pointer</code> on clickable things that are not links.']},

{id:'pseudoclass',g:'effects',t:'Pseudo-classes (:hover, :nth-child…)',goal:'style elements by their state or position',tags:[':hover',':focus',':first-child',':nth-child'],kw:'pseudo class hover focus first-child last-child nth-child odd even',
why:`<p>A pseudo-class picks elements by <b>state</b> (<code>:hover</code>, <code>:focus</code>) or <b>position</b> (<code>:first-child</code>, <code>:last-child</code>, <code>:nth-child(odd)</code>). It starts with one colon.</p>`,
html:`<ul>
  <li>Pens</li>
  <li>Notebooks</li>
  <li>Bags</li>
  <li>Lab coats</li>
  <li>Calculators</li>
</ul>
<input type="text" placeholder="Click here">`,
css:[['li:first-child','color: #c62828','First item turns red'],['li:last-child','font-weight: bold','Last item becomes bold'],['li:nth-child(odd)','background: #eef4ff','Items 1, 3, 5 get a background'],['li:hover','background: #fde68a','Item turns yellow under the mouse'],['input:focus','outline: 3px solid #16a34a','Green glow when you click in the box']],
tips:['A space before the colon: <code>li :hover</code>. Write <code>li:hover</code>.']},

{id:'pseudoel',g:'effects',t:'::before and ::after',goal:'add text or a symbol with CSS only',tags:['::before','::after'],kw:'pseudo element before after content star required',
why:`<p><code>::before</code> and <code>::after</code> add content before or after an element's own content, from CSS. They need <code>content: "…"</code> to show. They start with two colons.</p>`,
html:`<p class="new">School bag</p>
<label class="req">Name</label>
<p class="price">799</p>`,
css:[['.new::before','content: "NEW "','“NEW” appears before the text'],['.new::before','color: #c62828','“NEW” turns red'],['.new::before','font-weight: bold','“NEW” becomes bold'],['.req::after','content: " *"','A star appears after the label'],['.req::after','color: #c62828','Star turns red'],['.price::before','content: "₹"','Rupee sign added before the price']],
tips:['Forgetting <code>content</code>. Without it nothing appears, even with other styles.']},

{id:'variables',g:'effects',t:'CSS variables',goal:'change one colour everywhere at once',tags:['--variable','var()'],kw:'css variables custom properties var root theme',
why:`<p>Save a value once in <code>:root</code> with a name starting with <code>--</code>. Use it anywhere with <code>var(--name)</code>. Change it in one place and every use updates.</p>`,
html:`<h2 class="title">CampusKart</h2>
<button class="btn">Shop now</button>
<button class="btn">Add to cart</button>`,base:`.btn { color: white; border: none; padding: 10px 18px; border-radius: 6px; }`,
css:[[':root','--main: #1d4ed8','Pick a colour',{opts:{'#1d4ed8':'Blue','#16a34a':'Green: title and both buttons change','#db2777':'Pink'}}],['.btn','background: var(--main)','Buttons use the saved colour'],['.title','color: var(--main)','Title uses the same colour']],
tips:['Forgetting the two dashes: <code>--main</code>, and <code>var(--main)</code>.']},

/* ---------- SETUP ---------- */
{id:'boilerplate',g:'setup',t:'Basic page structure',goal:'start a new HTML page',tags:['!DOCTYPE','html','head','body'],kw:'boilerplate starter template skeleton new file',
why:`<p>Every page starts the same. In VS Code, type <code>!</code> and press Tab to get it.</p><p><code>&lt;!DOCTYPE html&gt;</code> = this is HTML5. <code>head</code> = settings (not shown). <code>body</code> = everything you see on the page.</p>`,
html:`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusKart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Hello, CampusKart!</h1>
</body>
</html>`,
css:[],
tips:['Putting visible content in <code>head</code>.','Two <code>body</code> tags in one page.']},

{id:'title',g:'setup',t:'Tab title & icon',goal:'set the title on the browser tab',tags:['title','link rel="icon"'],kw:'tab name favicon title icon',
why:`<p><code>title</code> in the <code>head</code> is the text on the browser tab and in Google results. <code>link rel="icon"</code> sets the small tab icon.</p>`,
html:`<head>
  <title>CampusKart – Shop</title>
  <link rel="icon" href="logo.png">
</head>
<body>
  <h1>The title is on the tab, not here</h1>
</body>`,
note:'The tab title is not visible inside this preview. Open your own file in the browser and look at the tab.',
css:[],
tips:['Thinking <code>title</code> shows on the page. Use <code>h1</code> for the page heading.']},

{id:'viewport',g:'setup',t:'Make it work on phones',goal:'make the page scale correctly on phones',tags:['meta viewport'],kw:'viewport meta mobile phone zoom',
why:`<p>Without this line, phones show your page like a tiny desktop page. It goes inside <code>head</code>. VS Code's <code>!</code> shortcut adds it for you.</p>`,
html:`<meta name="viewport" content="width=device-width, initial-scale=1.0">`,
css:[],
tips:['Deleting it from the boilerplate. Then media queries do not work on phones.']},

{id:'addcss',g:'setup',t:'3 ways to add CSS',goal:'connect CSS to my HTML',tags:['style=""','<style>','<link>'],kw:'inline internal external stylesheet link css file',
why:`<p><b>Inline:</b> <code>style=""</code> inside one tag. <b>Internal:</b> a <code>&lt;style&gt;</code> tag in the head. <b>External:</b> a separate <code>style.css</code> file, connected with <code>&lt;link rel="stylesheet" href="style.css"&gt;</code> in the head.</p><p>Use external for real projects. One CSS file can style every page.</p>`,
html:`<!-- 1. Inline -->
<p style="color: red;">Inline style</p>

<!-- 2. Internal -->
<style>
  .blue { color: blue; }
</style>
<p class="blue">Internal style</p>

<!-- 3. External (best): put this in head
<link rel="stylesheet" href="style.css">
-->`,
css:[],
tips:['Wrong path in <code>href</code>. If style.css is in a folder called css, write <code>css/style.css</code>.','Writing <code>&lt;style&gt;</code> tags inside style.css. The file holds only CSS rules.']}
];

/* ---------- real-website examples ---------- */
const PRODUCTS=[['School bag','₹799','bag.jpg'],['Gel pens (5)','₹60','pen.jpg'],['Notebook set','₹180','notebook.jpg'],['Steel bottle','₹349','bottle.jpg'],['Calculator','₹650','calc.jpg'],['Lab coat','₹420','coat.jpg']];
function cardsHTML(n,cls){return PRODUCTS.slice(0,n).map(p=>`  <div class="card">
    <img src="${p[2]}" alt="${p[0]}">
    <h4>${p[0]}</h4>
    <p>${p[1]}</p>
  </div>`).join('\n');}
const HDR=`.header { background: #1e3a8a; color: white; padding: 12px 16px; }
.logo { font-weight: bold; font-size: 22px; }
.header a { color: white; text-decoration: none; }
.search { padding: 9px; border-radius: 6px; border: none; min-width: 0; }`;
const CARDS=`.card { width: 140px; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; background: white; }
.card img { width: 100%; border-radius: 6px; display: block; }
.card h4 { margin: 8px 0 4px; font-size: 15px; }
.card p { margin: 0; color: #16a34a; font-weight: bold; }`;

const REAL={
'flex-on':{label:'Website header',why:'Almost every website header is a flex container. The logo, search box and cart are its children. Without flex they stack one below another. With flex they sit in one row.',
html:`<header class="header">
  <div class="logo">CampusKart</div>
  <input class="search" placeholder="Search for pens, books…">
  <a href="cart.html">Cart (2)</a>
</header>`,base:HDR+`
.header { gap: 16px; align-items: center; }`,map:{'.container':'.header'}},

'flex-direction':{label:'Product details page',why:'On laptops, shops show the photo beside the details (row). On phones, the photo goes on top (column). Only flex-direction changes.',
html:`<div class="product">
  <img src="bag.jpg" alt="Blue school bag">
  <div class="info">
    <h3>School bag</h3>
    <p class="price">₹799</p>
    <p>Waterproof, 3 pockets, fits a 15-inch laptop.</p>
    <button>Add to cart</button>
  </div>
</div>`,base:`.product { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; gap: 16px; }
.product img { width: 200px; border-radius: 8px; }
.info h3 { margin: 0 0 6px; }
.price { color: #16a34a; font-weight: bold; font-size: 20px; margin: 0; }
.info button { background: #1d4ed8; color: white; border: none; padding: 10px 18px; border-radius: 6px; }`,map:{'.container':'.product'}},

'justify':{label:'Header: logo left, menu right',why:'Most headers use space-between. The first child (logo) goes to the left edge and the last child (menu) goes to the right edge.',
html:`<header class="header">
  <div class="logo">CampusKart</div>
  <nav class="links">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>`,base:HDR+`
.header { align-items: center; }
.links { display: flex; gap: 16px; }`,map:{'.container':'.header'}},

'align':{label:'Header with items of different heights',why:'The logo is taller than the button. align-items: center lines everything up through the middle. Try flex-start and see how uneven it looks.',
html:`<header class="header">
  <div class="logo">CampusKart</div>
  <input class="search" placeholder="Search">
  <button class="login">Login</button>
</header>`,base:HDR+`
.header { gap: 12px; }
.logo { font-size: 34px; }
.login { background: #f59e0b; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; }`,map:{'.container':'.header'},skip:['height']},

'gap':{label:'Filter chips',why:'Shopping sites show filters as small chips in a row. gap gives equal space between them.',
html:`<div class="chips">
  <span class="chip">Under ₹500</span>
  <span class="chip">4★ &amp; above</span>
  <span class="chip">Free delivery</span>
  <span class="chip">New arrivals</span>
  <span class="chip">On sale</span>
</div>`,base:`.chips { flex-wrap: wrap; }
.chip { border: 1px solid #94a3b8; border-radius: 20px; padding: 6px 12px; font-size: 14px; background: white; }`,map:{'.container':'.chips'}},

'wrap':{label:'Product cards on a shop page',why:'With wrap, cards move to the next line when there is no room. This is why a shop shows 4 cards in a row on a laptop and 2 on a phone. Try Phone.',
html:`<div class="products">
${cardsHTML(6)}
</div>`,base:CARDS,map:{'.container':'.products'}},

'grow':{label:'Search box that fills the header',why:'The search box has flex-grow: 1, so it stretches to fill all the space between the logo and the cart. Big shopping sites build their search bar this way.',
html:`<header class="header">
  <div class="logo">CampusKart</div>
  <input class="search" placeholder="Search for pens, books…">
  <a href="cart.html">Cart</a>
</header>`,base:HDR+`
.header { align-items: center; }`,map:{'.container':'.header','.box:nth-child(2)':'.search'}},

'alignself':{label:'Chat messages',why:'In chat apps, all messages are in one flex column. Your own messages use align-self: flex-end, so they go to the right side.',
html:`<div class="chat">
  <div class="msg">Is the bag available in black?</div>
  <div class="msg me">Yes, it is in stock.</div>
  <div class="msg">Great, ordering now!</div>
</div>`,base:`.chat { flex-direction: column; gap: 8px; background: #ece5dd; padding: 12px; border-radius: 10px; }
.msg { background: white; padding: 8px 12px; border-radius: 10px; max-width: 70%; }
.me { background: #dcf8c6; }`,map:{'.container':'.chat','.box:nth-child(2)':'.me'},skip:['height']},

'order':{label:'Pricing plans',why:'Sites often move the recommended plan to the front, especially on phones, using order. The HTML stays the same.',
html:`<div class="plans">
  <div class="plan"><h4>Basic</h4><p>₹0</p></div>
  <div class="plan"><h4>Student</h4><p>₹99 / month</p></div>
  <div class="plan best"><h4>Pro ★</h4><p>₹199 / month</p></div>
</div>`,base:`.plan { flex: 1; border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; text-align: center; }
.plan h4, .plan p { margin: 4px 0; }
.best { border: 2px solid #1d4ed8; background: #eef4ff; }`,map:{'.container':'.plans','.box:nth-child(1)':'.plan:nth-child(1)','.box:nth-child(3)':'.plan:nth-child(3)'}},

'grid-cols':{label:'Product grid',why:'Shop pages put products in a grid. Try the auto-fit value and switch to Phone: the number of columns changes by itself.',
html:`<div class="products">
${cardsHTML(6)}
</div>`,base:CARDS+`
.products .card { width: auto; }`,map:{'.container':'.products'}},

'grid-span':{label:'Photo gallery with a featured photo',why:'News and photo sites make the main photo bigger by letting it span more columns and rows.',
html:`<div class="gallery">
  <img src="bag.jpg" alt="Bag">
  <img src="coat.jpg" alt="Lab coat">
  <img src="pen.jpg" alt="Pens">
  <img src="bottle.jpg" alt="Bottle">
  <img src="calc.jpg" alt="Calculator">
  <img src="notebook.jpg" alt="Notebook">
</div>`,base:`.gallery img { width: 100%; height: 100%; min-height: 90px; object-fit: cover; border-radius: 8px; display: block; }`,
map:{'.container':'.gallery','.box:nth-child(1)':'.gallery img:nth-child(1)','.box:nth-child(2)':'.gallery img:nth-child(2)'}},

'hide':{label:'Account dropdown menu',why:'Menus stay hidden (display: none) until you click the button. JavaScript then shows them. You will learn that part in the JavaScript unit.',
html:`<button class="acc">My account ▾</button>
<ul class="menu">
  <li>My orders</li>
  <li>Wishlist</li>
  <li>Log out</li>
</ul>
<p>Page content continues here…</p>`,base:`.acc { padding: 8px 14px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; }
.menu { list-style: none; padding: 0; margin: 4px 0; width: 170px; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.15); background: white; }
.menu li { padding: 8px 12px; }`,map:{'.hide':'.menu'}},

'size':{label:'Article reading width',why:'News and blog sites limit the text width with max-width, so lines are not too long to read. On phones, width: 90% keeps it inside the screen.',
html:`<div class="article">
  <h2>How to pack your bag for lab day</h2>
  <p>Carry your lab coat, a notebook, two pens and your ID card. Keep your laptop charger in the side pocket so it is easy to find.</p>
  <p>Check the timetable the night before so you do not forget anything.</p>
</div>`,base:`.article { background: white; border: 1px solid #e2e8f0; padding: 12px 16px; line-height: 1.6; }`,map:{'.box':'.article'}},

'overflow':{label:'Category row you can swipe',why:'Food and shopping apps show categories in one line that you swipe sideways. That is overflow-x: auto. Try auto and hidden.',
html:`<div class="cats">
  <span>Books</span><span>Pens</span><span>Notebooks</span><span>Bags</span>
  <span>Lab coats</span><span>Calculators</span><span>Files</span>
  <span>Art supplies</span><span>Bottles</span><span>Snacks</span>
</div>`,base:`.cats { display: flex; gap: 8px; white-space: nowrap; border: 1px dashed #cbd5e1; padding: 6px; }
.cats span { flex: none; padding: 8px 14px; background: #eef4ff; border-radius: 20px; }`,map:{'.box':'.cats'}},

'position':{label:'Cart icon with item count',static:true,why:'The cart is position: relative. The red number is position: absolute with top and right, so it sits on the corner of the cart.',
html:`<a class="cart" href="cart.html">Cart<span class="count">3</span></a>`,base:`.cart { position: relative; display: inline-block; margin: 20px; padding: 12px 18px; background: #1e3a8a; color: white; border-radius: 8px; text-decoration: none; }
.count { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; background: #dc2626; color: white; font-size: 13px; display: grid; place-items: center; }`},

'zindex':{label:'Dropdown over the page',static:true,why:'The menu is position: absolute and has a higher z-index than the banner, so it sits on top of the banner instead of behind it.',
html:`<div class="wrap">
  <button>Categories ▾</button>
  <ul class="menu"><li>Books</li><li>Pens</li><li>Bags</li></ul>
</div>
<div class="banner">Diwali Sale</div>`,base:`.wrap { position: relative; }

.menu { position: absolute; top: 36px; left: 0; z-index: 10; list-style: none; margin: 0; padding: 6px 0; width: 150px; background: white; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
.menu li { padding: 6px 12px; }
.banner { position: relative; z-index: 1; margin-top: 8px; height: 130px; border-radius: 10px; background: linear-gradient(135deg, #f59e0b, #db2777); color: white; font-size: 26px; font-weight: bold; display: grid; place-items: center; }`},

'transform':{label:'Product card on hover',why:'Move your mouse over a card. Shops scale or lift cards slightly on hover so they feel clickable. Your transform value is used on hover here.',
html:`<div class="products">
${cardsHTML(3)}
</div>`,base:CARDS+`
.products { display: flex; gap: 12px; padding: 20px; }
.card { transition: 0.3s; }`,map:{'.box':'.card:hover'}},

'transition':{label:'Add to cart button',why:'Hover the button. The colour changes smoothly because of transition. Almost every button on real sites has this.',
html:`<button class="btn">Add to cart</button>`,base:`.btn { background: #1d4ed8; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; }`,
map:{'.box':'.btn','.box:hover':'.btn:hover'},skip:['width']},

'animation':{label:'Loading spinner',static:true,why:'Every loading spinner is a @keyframes animation: a circle with one coloured side that rotates from 0 to 360 degrees, forever.',
html:`<div class="spinner"></div>
<p>Loading your orders…</p>`,base:`@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.spinner { width: 44px; height: 44px; border: 5px solid #e2e8f0; border-top-color: #1d4ed8; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px; }`}

/* ---------- sample images for preview ---------- */
function svgImg(label,c1,c2,w,h){
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/><text x="50%" y="52%" font-family="Arial" font-size="${Math.round(h/9)}" fill="white" text-anchor="middle" dominant-baseline="middle">${label}</text></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(s);
}
const ASSETS={
  'bag.jpg':svgImg('bag.jpg','#3b82f6','#1e3a8a',400,300),
  'photo.jpg':svgImg('photo.jpg','#f59e0b','#be123c',400,400),
  'logo.png':svgImg('logo','#10b981','#065f46',100,100),
  'product.jpg':svgImg('product.jpg','#8b5cf6','#4c1d95',400,300),
  'pen.jpg':svgImg('pens','#0ea5e9','#0369a1',400,300),
  'notebook.jpg':svgImg('notebook','#f97316','#9a3412',400,300),
  'bottle.jpg':svgImg('bottle','#14b8a6','#115e59',400,300),
  'calc.jpg':svgImg('calculator','#64748b','#1e293b',400,300),
  'coat.jpg':svgImg('lab coat','#a78bfa','#5b21b6',400,300)
};
function withAssets(s){for(const k in ASSETS){s=s.split(k).join(ASSETS[k]);}return s;}

const BASE='body{font-family:Arial,Helvetica,sans-serif;margin:12px;color:#222;background:#fff;font-size:16px}';

/* ---------- state ---------- */
const state={id:null,html:{},on:{},val:{},device:'laptop',view:'boxes',xr:'header'};
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const byId=id=>ITEMS.find(i=>i.id===id);
/* make ids unique (span used twice) */
(function(){const seen={};ITEMS.forEach(i=>{if(seen[i.id]){i.id=i.id+'-'+i.g;}seen[i.id]=1;});})();

function onList(item){if(!state.on[item.id])state.on[item.id]=item.css.map(()=>false);return state.on[item.id];}
function valList(item){if(!state.val[item.id])state.val[item.id]={};return state.val[item.id];}
function cssParts(entry,item,idx){const [s,d,e,x]=entry;let media='',sel=s;if(s.includes('|')){[media,sel]=s.split('|');}const i=d.indexOf(':');let val=d.slice(i+1).trim();const opts=x&&x.opts;
  if(opts&&item){const v=valList(item)[idx];if(v!==undefined)val=v;}
  return {media,sel,prop:d.slice(0,i).trim(),val,effect:opts&&opts[val]?opts[val]:e,opts};}

function buildCSS(item,forcePlain){
  const on=onList(item);const blocks=[];const find=(m,s)=>{let b=blocks.find(x=>x.m===m&&x.s===s);if(!b){b={m,s,d:[]};blocks.push(b);}return b;};
  item.css.forEach((c,i)=>{if(!on[i])return;const p=cssParts(c,item,i);find(p.media,p.sel).d.push(p);});
  let plain='',hl='';
  const medias=[...new Set(blocks.map(b=>b.m))];
  medias.forEach(m=>{
    const ind=m?'  ':'';
    if(m){plain+=m+' {\n';hl+=`<span class="k-at">${esc(m)}</span> {\n`;}
    blocks.filter(b=>b.m===m).forEach(b=>{
      plain+=`${ind}${b.s} {\n`;hl+=`${ind}<span class="k-sel">${esc(b.s)}</span> {\n`;
      b.d.forEach(p=>{plain+=`${ind}  ${p.prop}: ${p.val};\n`;hl+=`${ind}  <span class="k-prop">${esc(p.prop)}</span>: <span class="k-val">${esc(p.val)}</span>;\n`;});
      plain+=`${ind}}\n`;hl+=`${ind}}\n`;
    });
    if(m){plain+='}\n';hl+='}\n';}
  });
  plain=plain.trim();hl=hl.trim();const user=plain;
  if(item.base){const note='/* Already added, so you can see the boxes */';
    plain=note+'\n'+item.base+(plain?'\n\n'+plain:'');
    hl=`<span class="k-dim">${esc(note)}\n${esc(item.base)}</span>`+(hl?'\n\n'+hl:'');}
  return {plain,hl,user};
}

function buildRealCSS(item){
  const r=item.real;if(r.static)return r.base;
  const on=onList(item);const lines=[];
  item.css.forEach((c,i)=>{if(!on[i])return;const p=cssParts(c,item,i);if(r.skip&&r.skip.includes(p.prop))return;const sel=r.map[p.sel];if(!sel)return;
    lines.push(p.media?`${p.media} { ${sel} { ${p.prop}: ${p.val}; } }`:`${sel} { ${p.prop}: ${p.val}; }`);});
  return r.base+'\n'+lines.join('\n');
}
function viewOf(item){return item.real&&state.view==='real'?'real':'boxes';}
function previewCSS(item){return viewOf(item)==='real'?buildRealCSS(item):buildCSS(item).plain;}
function hlCss(t){return t.split('\n').map(line=>{let out='';let rest=line;const bi=line.indexOf('{');
  if(bi>-1){const s=line.slice(0,bi);out+=`<span class="${s.trim().startsWith('@')?'k-at':'k-sel'}">${esc(s)}</span>{`;rest=line.slice(bi+1);}
  out+=esc(rest).replace(/([\w-]+)(\s*:\s*)([^;]+)(;)/g,'<span class="k-prop">$1</span>$2<span class="k-val">$3</span>$4');return out;}).join('\n');}

function mkHelpers(d){
  const w=d.defaultView;const q=s=>d.querySelector(s),qa=s=>[...d.querySelectorAll(s)];
  const cs=el=>el&&w?w.getComputedStyle(el):{};
  const r=el=>el?el.getBoundingClientRect():{left:0,right:0,top:0,bottom:0,width:0,height:0};
  const px=v=>parseFloat(v)||0;
  const inner=el=>{const b=r(el),s=cs(el);return {left:b.left+px(s.borderLeftWidth)+px(s.paddingLeft),right:b.right-px(s.borderRightWidth)-px(s.paddingRight),top:b.top+px(s.borderTopWidth)+px(s.paddingTop),bottom:b.bottom-px(s.borderBottomWidth)-px(s.paddingBottom)};};
  const rgb=c=>(String(c||'').match(/[\d.]+/g)||[]).map(Number);
  const isBlue=c=>{const [a,g,b]=rgb(c);return b>a+40&&b>g+20;};
  const isRed=c=>{const [a,g,b]=rgb(c);return a>g+60&&a>b+60;};
  const rules=()=>{const out=[];const walk=(list,media)=>{for(const x of list){if(x.cssRules&&x.media)walk(x.cssRules,x.conditionText||x.media.mediaText||'');else if(x.selectorText)out.push({sel:x.selectorText,style:x.style,media});}};
    for(const sh of d.styleSheets){try{walk(sh.cssRules,'');}catch(e){}}return out;};
  const flex=el=>/flex/.test(cs(el).display||'');
  const cols=el=>String(cs(el).gridTemplateColumns||'').trim().split(/\s+/).filter(x=>x&&x!=='none').map(px);
  return {q,qa,cs,r,px,inner,isBlue,isRed,rules,flex,cols};
}
function fnv(s){let h=0x811c9dc5;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h;}
const normRoll=r=>String(r||'').toUpperCase().replace(/\s+/g,'');
function makeCode(roll,set,mask){const m=mask.toString(16).toUpperCase().padStart(2,'0');const h=fnv(`${normRoll(roll)}|${set}|${m}|fsd1-tagfinder-2026`).toString(36).toUpperCase().padStart(7,'0').slice(-5);return `${set}-${m}-${h}`;}

    <p class="hint">Your work is saved in this browser only. Use the same browser to continue later.</p>
  </section>
  <div class="settabs" role="group" aria-label="Practice sets">${PRACTICE.map(s=>`<button class="settab" data-set="${s.key}" aria-pressed="${s===set}">${esc(s.name)} <span class="cnt ${solvedCount(s)===s.items.length?'full':''}">${solvedCount(s)}/${s.items.length}</span></button>`).join('')}</div>
  <div class="bench">
    <div class="col">
      <section class="card">
        <div class="chnav" role="group" aria-label="Challenges">${set.items.map((c,i)=>`<button class="chn ${PS.solved[c.id]?'done':''}" data-ch="${i}" aria-current="${i===state.pidx}" aria-label="Challenge ${i+1}${PS.solved[c.id]?', solved':''}">${PS.solved[c.id]?'✓':i+1}</button>`).join('')}</div>
        <h3 class="ch-title">${state.pidx+1}. ${esc(ch.t)}</h3>
        <p class="task">${ch.task}</p>
        ${ch.mode==='css'?`<details class="fullwrap"><summary>See the HTML (you only write CSS)</summary><pre class="full">${esc(ch.html)}</pre></details>`:''}
        <label class="edl" for="p-editor">${ch.mode==='css'?'Your CSS':'Your HTML'}</label>
        <textarea class="code" id="p-editor" spellcheck="false">${esc(work)}</textarea>
        <div class="pbtns"><button class="btn-p" id="p-check">Check my answer</button><button class="btn-s" id="p-hint">Hint</button><button class="btn-s" id="p-reset">Start again</button>${byId(ch.topic)?`<button class="btn-s" data-go="${ch.topic}">Learn: ${esc(byId(ch.topic).t)} →</button>`:''}</div>
        <p id="p-hinttext" class="hintbox" hidden>${esc(ch.hint)}</p>
        <div id="p-fb" class="fb ${msg?(msg.ok?'ok':'bad'):''}" aria-live="polite">${msg?(msg.ok?'✓ ':'✗ ')+esc(msg.text):''}</div>
        ${PS.solved[ch.id]&&state.pidx<tot-1?`<button class="btn-p" id="p-next" style="margin-top:10px">Next challenge →</button>`:''}
      </section>
    </div>
    <div class="col sticky">
      <div class="browser"><div class="bar"><span class="blabel goal">Goal</span><div class="url">what yours should look like</div></div>
        <div class="stage ${phone}"><iframe class="pv pp" id="p-goal" sandbox="allow-same-origin" title="Goal"></iframe></div></div>
      <div class="browser"><div class="bar"><span class="blabel">Your result</span><div class="url">index.html</div>
        <div class="seg" role="group" aria-label="Screen size"><button data-dev="laptop" aria-pressed="${state.device==='laptop'}">Laptop</button><button data-dev="phone" aria-pressed="${state.device==='phone'}">Phone</button></div></div>
        <div class="stage ${phone}"><iframe class="pv pp" id="p-res" sandbox="allow-same-origin" title="Your result"></iframe></div></div>
    </div>
  </div>
  <section class="card codecard">
    <h3 class="step-h">Completion code · ${esc(set.name)}</h3>
    <div class="pbar" role="img" aria-label="${n} of ${tot} solved"><i style="width:${Math.round(n/tot*100)}%"></i></div>
    <p class="hint">${n} of ${tot} challenges solved.${n<tot?' You can get a code now; it shows your score. Solve more and get a new code later.':' Well done, the set is complete.'}</p>
    <button class="btn-p" id="p-code" ${n?'':'disabled'}>Get my code</button>
    <div id="p-codeout"></div>
  </section>`;
  renderTopics($('#q').value);
  const ed=$('#p-editor');let t;
  const load=(id,sol)=>{const f=$(id);f.onload=()=>hook(f);f.srcdoc=pDocs(ch,ed.value,sol);};
  load('#p-goal',true);load('#p-res',false);
  ed.addEventListener('input',()=>{PS.work[ch.id]=ed.value;clearTimeout(t);t=setTimeout(()=>{psSave();load('#p-res',false);},300);});
  ed.addEventListener('keydown',e=>{if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();ed.setRangeText('  ',ed.selectionStart,ed.selectionEnd,'end');ed.dispatchEvent(new Event('input'));}});
  $('#p-name').oninput=e=>{PS.name=e.target.value;psSave();};
  $('#p-roll').oninput=e=>{PS.roll=e.target.value;psSave();};
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{state.pset=b.dataset.set;state.pidx=0;state.pmsg=null;openPractice();});
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{state.pidx=+b.dataset.ch;state.pmsg=null;openPractice();});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open(b.dataset.go,true));
  document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{state.device=b.dataset.dev;document.querySelectorAll('[data-dev]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.stage').forEach(s=>s.classList.toggle('phone',state.device==='phone'));});
  $('#p-hint').onclick=()=>{$('#p-hinttext').hidden=!$('#p-hinttext').hidden;};
  $('#p-reset').onclick=()=>{delete PS.work[ch.id];psSave();ed.value=ch.mode==='html'?HTML_START:CSS_START;load('#p-res',false);};
  if($('#p-next'))$('#p-next').onclick=()=>{state.pidx++;state.pmsg=null;openPractice();};
  $('#p-check').onclick=()=>{
    PS.work[ch.id]=ed.value;psSave();
    const run=d=>{let res;try{res=ch.checks(mkHelpers(d));}catch(e){res=[[false,'Something in your code could not be checked. Look for a typo.']];}
      const fail=res.find(x=>!x[0]);
      if(fail){state.pmsg={id:ch.id,ok:false,text:fail[1]};const fb=$('#p-fb');fb.className='fb bad';fb.textContent='✗ '+fail[1];}
      else{PS.solved[ch.id]=true;psSave();state.pmsg={id:ch.id,ok:true,text:'Correct! Well done.'};openPractice();}};
    if(ch.mode==='html'){run(new DOMParser().parseFromString(ed.value,'text/html'));}
    else{const f=$('#p-res');f.onload=()=>{hook(f);setTimeout(()=>run(f.contentDocument),60);};f.srcdoc=pDocs(ch,ed.value,false);}
  };
  $('#p-code').onclick=()=>{
    const out=$('#p-codeout');
    if(!PS.name.trim()||!normRoll(PS.roll)){out.innerHTML='<p class="fb bad">Type your name and roll number at the top first.</p>';$('#p-name').focus();return;}
    const code=makeCode(PS.roll,set.key,setMask(set));
    out.innerHTML=`<div class="codebox"><span class="codeval" id="codeval">${code}</span><button class="btn-s" id="copy-code">Copy</button></div>
      <p class="hint">${esc(PS.name)} · ${esc(normRoll(PS.roll))} · ${esc(set.name)} · ${n}/${tot} solved. Submit this code the way your teacher tells you. It only works with your own roll number.</p>`;
    $('#copy-code').onclick=()=>copy(code,$('#codeval'),'Code copied');
  };
  if(fromClick){$('#side').classList.remove('open');$('#browse').setAttribute('aria-expanded','false');
    if(window.innerWidth<=860)$('#main').scrollIntoView({behavior:'smooth'});else window.scrollTo({top:0,behavior:'smooth'});}
}

/* ---------- utils ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function copy(text,el,msg){
  const done=()=>toast(msg);
  const fallback=()=>{try{if(el.select){el.focus();el.select();}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast('Selected. Press Ctrl+C to copy.');}catch(e){}};
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
}
window.addEventListener('resize',()=>fitFrame());

/* ---------- start ---------- */
const rawHash=(location.hash||'').slice(1);
const isAuthHash=rawHash.startsWith('access_token=')||rawHash.includes('&access_token=')||rawHash.startsWith('error=')||rawHash.startsWith('error_description=')||rawHash.startsWith('refresh_token=');
const isAuthQuery=location.search.includes('code=')||location.search.includes('error=');
const isAuthRedirect=isAuthHash||isAuthQuery;
const start=isAuthRedirect?'navbar':rawHash;
renderTopics('');
open(byId(start)||['xray','practice'].includes(start)?start:'navbar',false,isAuthRedirect);
</script>

<script>
(function(){
  const KEY='hide-topics';const app=document.querySelector('.app'),b=document.getElementById('sidetoggle');
  const set=h=>{app.classList.toggle('noside',h);b.setAttribute('aria-expanded',String(!h));b.querySelector('span').textContent=h?'Show topics':'Hide topics';
    try{localStorage.setItem(KEY,h?'1':'0');}catch(e){}window.dispatchEvent(new Event('resize'));};
  let h=false;try{h=localStorage.getItem(KEY)==='1';}catch(e){}
  set(h);b.addEventListener('click',()=>set(!app.classList.contains('noside')));
})();
</script>

<script type="module" src="js/theme.js"></script>
<script type="module" src="js/auth-ui.js"></script>
</body>
