<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 · Page Not Found | HTML &amp; CSS Tag Finder</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Recursive:wght,CASL,MONO@300..900,0..1,0..1&display=swap">
<script>
(function(){
  try{
    const saved=localStorage.getItem('theme');
    const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme=saved==='dark'||(!saved&&prefersDark)?'dark':'light';
    document.documentElement.classList.add(theme);
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#eff6ff;
  --display:"Recursive",ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1118; --panel:#111923; --ink:#f1f5f9; --muted:#94a3b8; --line:#1e293b;
  --accent:#3b82f6; --accent-ink:#0b1320; --accent-soft:#172554;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1118; --panel:#111923; --ink:#f1f5f9; --muted:#94a3b8; --line:#1e293b;
  --accent:#3b82f6; --accent-ink:#0b1320; --accent-soft:#172554;
  color-scheme:dark}
*{box-sizing:border-box}
body{
  margin:0;
  padding:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  text-align:center;
  padding:24px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:48px 32px;
  max-width:480px;
  width:100%;
  box-shadow:0 10px 25px -5px rgba(0,0,0,0.06), 0 8px 10px -6px rgba(0,0,0,0.04);
}
.badge{
  display:inline-block;
  font-family:var(--mono);
  font-size:3.5rem;
  font-weight:800;
  color:var(--accent);
  margin-bottom:8px;
  line-height:1;
}
h1{
  font-family:var(--display);
  font-size:1.75rem;
  font-weight:800;
  margin:12px 0 8px;
}
p{
  color:var(--muted);
  font-size:1rem;
  line-height:1.5;
  margin:0 0 24px;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--accent);
  color:var(--accent-ink);
  font-weight:700;
  font-size:0.95rem;
  text-decoration:none;
  padding:10px 20px;
  border-radius:10px;
  transition:transform 0.15s ease, opacity 0.15s ease;
}
.btn:hover{
  opacity:0.92;
  transform:translateY(-1px);
}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">&lt;404 /&gt;</div>
    <h1>Tag Not Found</h1>
    <p>The page or learning topic you were looking for doesn't exist or has moved.</p>
    <a href="/" class="btn">Return to Tag Finder</a>
  </div>
</body>
</html>
